[workspace]
members = [ "cli", "stats" ]
resolver = "2"

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.86"
tracing = "0.1"
tokio = { version = "1.48.0", features = ["full"] }
polars = {version = "0.49", features = ["lazy", "ndarray", "nightly", "performant"]}
ndarray = "0.16.1"

